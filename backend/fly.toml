# Fly.io — Spring Boot API (from backend/)
# https://fly.io/docs/
#
# First time (from this folder):
#   fly auth login
#   fly apps create pssm-buddha-sangha-api
#   fly secrets set MONGODB_URI="mongodb+srv://..." COOKIE_SECURE=true PSSM_CORS_ORIGINS="https://YOUR-VERCEL-APP.vercel.app,http://localhost:5173"
#   fly deploy
#
# Then point frontend/vercel.json /api rewrite at:
#   https://pssm-buddha-sangha-api.fly.dev

app = "pssm-buddha-sangha-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "90s"
    method = "GET"
    path = "/api/v1/places?kind=urban&limit=1"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
