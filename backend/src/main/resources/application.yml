spring:
  application:
    name: pssm-buddha-sangha
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pssm_sangha?replicaSet=rs0}
      auto-index-creation: false

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Hotel image is sent as a JPEG data URL inside JSON.
    max-http-form-post-size: 8MB
    max-swallow-size: 8MB
  servlet:
    session:
      cookie:
        name: PSSMSESSION
        http-only: true
        same-site: lax

pssm:
  cors:
    allowed-origins: ${PSSM_CORS_ORIGINS:http://localhost:5173}
