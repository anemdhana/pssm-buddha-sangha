services:
  mongo:
    image: mongo:7.0
    container_name: pssm-sangha-mongo
    ports:
      - "27017:27017"
    volumes:
      - pssm_mongo_data:/data/db
      - ./scripts/mongo-init:/docker-entrypoint-initdb.d:ro
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}).ok }"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  pssm_mongo_data:
