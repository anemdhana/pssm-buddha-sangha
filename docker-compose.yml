services:
  mysql:
    image: mysql:8.4
    container_name: pssm-sangha-mysql
    environment:
      MYSQL_DATABASE: pssm_sangha
      MYSQL_USER: pssm
      MYSQL_PASSWORD: pssm
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - pssm_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pssm_mysql_data:
